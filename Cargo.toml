[package]
name = "sqlc-gen-sqlx"
# When releasing to crates.io:
# - Remove path dependencies (if any)
# - Update CHANGELOG.md
# - Create a v0.2.x tag
version = "0.2.5"
edition = "2024"
rust-version = "1.94"
description = "A sqlc plugin that generates type-safe sqlx Rust code from SQL queries."
repository = "https://github.com/mathematic-inc/sqlc-gen-sqlx"
license = "MIT OR Apache-2.0"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-{ target }.zip"
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-{ target }.zip"
pkg-fmt = "zip"

[workspace]
resolver = "2"
members = [".", "examples/*"]

[workspace.dependencies]
serde_json = "1"
sqlx = { version = "0.9", features = ["bigdecimal", "bit-vec", "chrono", "ipnetwork", "mac_address", "postgres", "runtime-tokio", "uuid"] }
tokio = { version = "1", features = ["full"] }

[lib]
name = "sqlc_gen_sqlx"
path = "src/lib.rs"

[[bin]]
name = "sqlc-gen-sqlx"
path = "src/main.rs"

[dependencies]
buffa = "0.9"
convert_case = "0.11"
prettyplease = "0.3"
proc-macro2 = "1"
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
syn = { version = "3", features = ["full", "visit-mut"] }

[dev-dependencies]
insta = { version = "1", features = ["filters"] }
tempfile = "3"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
tokio = { workspace = true }

[profile.release]
opt-level = "z"
strip = "symbols"
lto = true
