version: "2"
plugins:
  - name: sqlc-gen-sqlx
    wasm:
      url: file://target/wasm32-wasip1/debug/sqlc-gen-sqlx.wasm
      sha256: "0405bc13685568ff34c6ff8fb43fc4fe474916b1175007c31b2485c99a6ee2a7"

sql:
  - schema: examples/basic/schema.sql
    queries: examples/basic/queries.sql
    engine: postgresql
    codegen:
      - plugin: sqlc-gen-sqlx
        out: examples/basic/src
        options:
          output: queries.rs

  - schema: examples/advanced-types/schema.sql
    queries: examples/advanced-types/queries.sql
    engine: postgresql
    codegen:
      - plugin: sqlc-gen-sqlx
        out: examples/advanced-types/src
        options:
          output: queries.rs

  - schema: examples/batch/schema.sql
    queries: examples/batch/queries.sql
    engine: postgresql
    codegen:
      - plugin: sqlc-gen-sqlx
        out: examples/batch/src
        options:
          output: queries.rs

  - schema: examples/enums/schema.sql
    queries: examples/enums/queries.sql
    engine: postgresql
    codegen:
      - plugin: sqlc-gen-sqlx
        out: examples/enums/src
        options:
          output: queries.rs

  - schema: examples/borrowed/schema.sql
    queries: examples/borrowed/queries.sql
    engine: postgresql
    codegen:
      - plugin: sqlc-gen-sqlx
        out: examples/borrowed/src
        options:
          output: queries.rs
          overrides:
            - db_type: "text"
              borrowed_rs_type: "&str"
