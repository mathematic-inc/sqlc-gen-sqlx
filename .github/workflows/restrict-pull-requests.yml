name: Restrict pull requests

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close-outside-pull-request:
    if: >-
      ${{
        !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) &&
        !contains(fromJSON('["renovate[bot]","dependabot[bot]"]'), github.event.pull_request.user.login)
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Close pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr close "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --comment "Thanks for your interest. We review contribution ideas in Discussions before our maintainers or agents implement them. Please start a Discussion: https://github.com/$GITHUB_REPOSITORY/discussions/new"
